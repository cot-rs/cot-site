name: Rust CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
# This will ensure that only one commit will be running tests at a time on each PR.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    # Run on external PRs and pushes to branches on the repo
    # This is to avoid double running on PRs from internal branches
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        rust: [stable, nightly]
        os: [ubuntu-latest]

    name: Build & test
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.21
        with:
          tool: nextest

      - name: Build
        run: cargo +${{ matrix.rust }} build

      - name: Test
        run: cargo +${{ matrix.rust }} nextest run --workspace

      - name: Test docs
        run: cargo +${{ matrix.rust }} test --workspace --doc

  clippy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository

    name: Clippy lint checks
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --no-deps -- -D warnings

  rustfmt:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository

    name: Code formatting checks
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run fmt
        run: cargo fmt --all -- --check

  machete:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository

    name: Machete dependencies checks
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-machete
        uses: bnjbvr/cargo-machete@v0.9.2

  integration-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository

    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out cot-site
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check out the Cot docs executable
        uses: actions/checkout@v7
        with:
          repository: cot-rs/cot
          ref: 1638ac877352d22ce98d1b7f2f6e75d13fc519e8
          path: cot

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --prefix /tmp/posthog-playwright playwright@1.63.0
          /tmp/posthog-playwright/node_modules/.bin/playwright install --with-deps chromium

      # Patch only the checked-out Git dependency so this job tests this commit.
      - name: Use the checked-out cot-site source
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [patch."https://github.com/cot-rs/cot-site.git"]
          cot-site = { path = "$GITHUB_WORKSPACE" }
          EOF

      - name: Build docs website
        run: cargo build --manifest-path cot/docs/site/Cargo.toml

      - name: Run consent state unit checks
        run: node tests/playwright/posthog-consent-state.cjs

      - name: Start analytics-disabled website
        run: |
          cd cot/docs/site
          POSTHOG_ENABLED=false POSTHOG_ALLOW_LOCALHOST=false \
            ./target/debug/docs-site -l 127.0.0.1:18089 > /tmp/docs-disabled.log 2>&1 &
          echo $! > /tmp/docs-disabled.pid

      - name: Start analytics-enabled website
        run: |
          cd cot/docs/site
          POSTHOG_ENABLED=true \
          POSTHOG_PROJECT_TOKEN=phc_ci_test_token \
          POSTHOG_HOST=https://eu.i.posthog.com \
          POSTHOG_ALLOW_LOCALHOST=true \
            ./target/debug/docs-site -l 127.0.0.1:18090 > /tmp/docs-enabled.log 2>&1 &
          echo $! > /tmp/docs-enabled.pid

      - name: Wait for both websites
        run: |
          for url in http://127.0.0.1:18089/ http://127.0.0.1:18090/; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" >/dev/null
          done

      - name: Run all integration tests
        env:
          PLAYWRIGHT_MODULE: /tmp/posthog-playwright/node_modules/playwright
        run: node tests/playwright/run.cjs http://127.0.0.1:18089/ http://127.0.0.1:18090/

      - name: Stop docs websites
        if: always()
        run: |
          for pid_file in /tmp/docs-disabled.pid /tmp/docs-enabled.pid; do
            if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" || true; fi
          done
