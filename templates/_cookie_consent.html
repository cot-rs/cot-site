<section id="cookie-banner" class="cookie-banner position-fixed bottom-0 start-0 z-3 m-3 p-3 bg-body border rounded-4 shadow-lg small ph-no-capture" aria-labelledby="cookie-banner-title" hidden>
    <h2 id="cookie-banner-title" class="fs-5 fw-bold mb-2">We want to improve the site for you</h2>
    <p class="text-body-secondary mb-3">We use optional cookies to understand how visitors use our site and improve the experience for everyone.</p>
    <p id="cookie-privacy-signal" class="text-body-secondary mb-3" hidden>Your browser requests privacy, so analytics stays off while this signal is enabled.</p>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary fw-bold flex-fill" data-consent="accept">Allow</button>
        <button type="button" class="btn btn-outline-secondary fw-bold flex-fill" data-consent="reject">Reject</button>
    </div>
</section>
