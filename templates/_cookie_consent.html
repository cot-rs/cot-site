<section id="cookie-banner" class="cookie-banner ph-no-capture" aria-labelledby="cookie-banner-title" hidden>
    <div class="cookie-banner-content">
        <div class="cookie-banner-copy">
            <h2 id="cookie-banner-title">We want to improve the site for you</h2>
            <p>Allow analytics cookies for site activity, approximate location, and session replays. If you reject, we only count page visits without analytics cookies or replays.</p>
            <p id="cookie-privacy-signal" hidden>Your browser requests privacy, so analytics stays off while this signal is enabled.</p>
        </div>
        <div class="cookie-banner-logo">
            <img class="cookie-banner-logo-dark" src="{{ base_context.static_files.url_for("static/images/cot-cookie-dark.svg")? }}" alt="" width="80" height="80">
            <img class="cookie-banner-logo-light" src="{{ base_context.static_files.url_for("static/images/cot-cookie-light.svg")? }}" alt="" width="80" height="80">
        </div>
    </div>
    <div class="cookie-actions">
        <button type="button" data-consent="accept">Allow</button>
        <button type="button" data-consent="reject">Reject</button>
    </div>
</section>
